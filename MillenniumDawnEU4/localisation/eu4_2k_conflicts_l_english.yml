l_english:
 eu4_2k_conflicts.1.t:0 "The Algiers Ceasefire"
 eu4_2k_conflicts.1.d:0 "Two years of trench warfare along the Badme front have cost tens of thousands of lives. Mediators from the Organization of African Unity have produced a cessation-of-hostilities agreement, with United Nations peacekeepers to patrol a temporary security zone between the two armies."
 eu4_2k_conflicts.1.a:0 "Sign the cessation of hostilities"
 eu4_2k_conflicts.1.b:0 "Continue the offensive"
 eu4_2k_conflicts.2.t:0 "The Algiers Ceasefire"
 eu4_2k_conflicts.2.d:0 "Ethiopia has signed the cessation of hostilities. United Nations peacekeepers will patrol the temporary security zone, and a boundary commission is to settle the disputed border."
 eu4_2k_conflicts.2.a:0 "Accept the ceasefire"
 eu4_2k_conflicts.10.t:0 "The Fall of Grozny"
 eu4_2k_conflicts.10.d:0 "Federal forces hold Grozny after a long siege that left much of the city in ruins. Organized separatist resistance has been driven into the southern mountains, but an insurgency is likely to continue for years."
 eu4_2k_conflicts.10.a:0 "Restore federal control"
 eu4_2k_conflicts.10.b:0 "Seek a negotiated settlement"
 eu4_2k_conflicts.10.c:0 "Begin counter-terrorism operations"
 eu4_2k_conflicts.11.t:0 "End of the Counter-Terrorism Operation"
 eu4_2k_conflicts.11.d:0 "Moscow has formally lifted the counter-terrorism regime in Chechnya. The republic's own authorities now carry out security operations, although attacks continue across the North Caucasus."
 eu4_2k_conflicts.11.a:0 "Hand security to the republic's authorities"
 eu4_2k_conflicts.20.t:0 "The Pretoria Agreement"
 eu4_2k_conflicts.20.d:0 "Under South African mediation, Kinshasa and Kigali have agreed that Rwandan forces will withdraw from Congolese territory in exchange for action against the armed groups that threaten Rwanda from the east."
 eu4_2k_conflicts.20.a:0 "Sign the agreement"
 eu4_2k_conflicts.20.b:0 "Fight on to expel the invaders"
 eu4_2k_conflicts.21.t:0 "The Luanda Agreement"
 eu4_2k_conflicts.21.d:0 "Angola has brokered an agreement for the withdrawal of Ugandan forces from the northeast and the creation of a pacification commission for Ituri."
 eu4_2k_conflicts.21.a:0 "Sign the agreement"
 eu4_2k_conflicts.21.b:0 "Fight on to expel the invaders"
 eu4_2k_conflicts.22.t:0 "The Transitional Government"
 eu4_2k_conflicts.22.d:0 "The Global and All-Inclusive Agreement provides for a transitional government in which the president shares power with four vice-presidents drawn from the government, the main rebel movements, and the unarmed opposition. The rebel administrations are to be reunited with the state and their fighters merged into a new national army."
 eu4_2k_conflicts.22.a:0 "Form the transitional government"
 eu4_2k_conflicts.22.b:0 "Govern without the rebel movements"
 eu4_2k_conflicts.23.t:0 "Joining the Transitional Government"
 eu4_2k_conflicts.23.d:0 "Kinshasa invites our movement to take its seats in the transitional government and to merge our forces into a new national army. Our foreign backers have already committed to withdraw."
 eu4_2k_conflicts.23.a:0 "Join the transitional government"
 eu4_2k_conflicts.23.b:0 "Keep our separate administration"
 eu4_2k_temporary_security_zone:0 "Temporary Security Zone"
 desc_eu4_2k_temporary_security_zone:0 "United Nations peacekeepers separate the armies along a demilitarized border zone while a boundary commission settles the frontier."
 eu4_2k_defied_mediation:0 "Defied International Mediation"
 desc_eu4_2k_defied_mediation:0 "We rejected an internationally mediated ceasefire and continued the war."
 eu4_2k_unmik_administration:0 "UN Interim Administration (UNSCR 1244)"
 desc_eu4_2k_unmik_administration:0 "Under Security Council Resolution 1244, Kosovo remains formally part of Yugoslavia but is governed by the United Nations Interim Administration Mission and secured by the NATO-led KFOR. Belgrade collects no revenue or recruits here until the mandate ends."
 eu4_2k_northern_alliance_stronghold:0 "Northern Alliance Mountain Strongholds"
 desc_eu4_2k_northern_alliance_stronghold:0 "The valleys of the Hindu Kush and Badakhshan give the United Front defensible positions that Taliban offensives have repeatedly failed to break."
 eu4_2k_chechen_insurgency:0 "Chechen Insurgency"
 desc_eu4_2k_chechen_insurgency:0 "Separatist and Islamist fighters continue a guerrilla campaign from the mountains of southern Chechnya under a federal counter-terrorism regime."
 eu4_2k_rejected_transition:0 "Rejected the Transitional Government"
 eu4_2k_chechen_settlement:0 "Negotiated Chechen Settlement"
 eu4_2k_unmik_mandate_ends_tt:0 "The UN Interim Administration in Kosovo ends."
