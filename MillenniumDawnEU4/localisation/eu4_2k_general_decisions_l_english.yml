l_english:
 eu4_2k_national_infrastructure_program_title:0 "Launch a National Infrastructure Program"
 eu4_2k_national_infrastructure_program_desc:0 "Commit public funds and administrative capacity to transport, utilities, communications, and construction projects across the country."
 eu4_2k_introduce_economic_reforms_title:0 "Introduce Economic Reforms"
 eu4_2k_introduce_economic_reforms_desc:0 "Restructure taxation, regulation, and industry to improve long-term economic performance, despite short-term social disruption."
 eu4_2k_modernize_armed_forces_title:0 "Modernize the Armed Forces"
 eu4_2k_modernize_armed_forces_desc:0 "Fund new equipment, training standards, logistics, and command systems for the national armed forces."
 eu4_2k_expand_higher_education_title:0 "Expand Higher Education"
 eu4_2k_expand_higher_education_desc:0 "Invest in universities, research institutions, and professional training to strengthen the country's knowledge base."
 eu4_2k_launch_anti_corruption_campaign_title:0 "Launch an Anti-Corruption Campaign"
 eu4_2k_launch_anti_corruption_campaign_desc:0 "Empower investigators and reform public procurement to reduce corruption, accepting temporary disruption to state revenue."
 eu4_2k_national_technology_initiative_title:0 "Establish a National Technology Initiative"
 eu4_2k_national_technology_initiative_desc:0 "Coordinate major public and private investment in research, advanced industry, and the adoption of emerging technologies."
 eu4_2k_infrastructure_program:0 "National Infrastructure Program"
 eu4_2k_infrastructure_program_desc:0 "The state is investing heavily in transport, utilities, communications, and construction."
 eu4_2k_economic_reforms:0 "Economic Reform Program"
 eu4_2k_economic_reforms_desc:0 "Regulatory and fiscal reforms are improving the economy while causing temporary social disruption."
 eu4_2k_armed_forces_modernization:0 "Armed Forces Modernization"
 eu4_2k_armed_forces_modernization_desc:0 "New equipment, training, logistics, and command systems are modernizing the armed forces."
 eu4_2k_higher_education_investment:0 "Higher Education Investment"
 eu4_2k_higher_education_investment_desc:0 "Expanded universities and research institutions are strengthening education and innovation."
 eu4_2k_anti_corruption_campaign:0 "Anti-Corruption Campaign"
 eu4_2k_anti_corruption_campaign_desc:0 "Investigations and procurement reforms are reducing corruption but disrupting government revenue."
 eu4_2k_technology_initiative:0 "National Technology Initiative"
 eu4_2k_technology_initiative_desc:0 "Coordinated investment is accelerating research, industrial innovation, and technology adoption."
