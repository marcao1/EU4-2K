l_english:
 age_of_discovery_short:0 "Information"
 age_of_discovery:0 "Information Age"
 age_of_discovery_desc:1 "Digital networks bind states, markets, and societies together on an unprecedented scale. Information has become a strategic resource, reshaping diplomacy, commerce, administration, and war."
 age_of_reformation_short:0 "AI"
 age_of_reformation:0 "Age of AI"
 age_of_reformation_desc:1 "Artificial intelligence transforms production, government, science, and military power. States must decide how autonomous systems will serve their people and how much authority humanity is prepared to share with its creations."
 age_of_absolutism_short:0 "Space"
 age_of_absolutism:0 "Space Age"
 age_of_absolutism_desc:1 "Advanced industry carries civilization beyond Earth. Orbital infrastructure, lunar settlements, and space-based fleets turn the frontier above into a new arena for wealth, influence, and conflict."
 age_of_revolutions_short:0 "Interplanetary"
 age_of_revolutions:0 "Interplanetary Age"
 age_of_revolutions_desc:1 "Human civilization now reaches across worlds. Interplanetary economies and distant societies challenge every established idea of sovereignty, identity, distance, and power as nations compete to shape an open-ended future."

