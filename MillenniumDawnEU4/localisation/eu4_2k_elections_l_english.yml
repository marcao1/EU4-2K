l_english:
 eu4_2k_elections.1.t:0 "An Election Campaign"
 eu4_2k_elections.1.d:0 "National elections are three months away. Our governing bloc must decide what message to put before the voters."
 eu4_2k_elections.1.a:0 "Campaign on the economy"
 eu4_2k_elections.1.b:0 "Campaign on security"
 eu4_2k_elections.1.c:0 "Campaign on national unity"
 eu4_2k_elections.2.t:0 "Election Results Are Counted"
 eu4_2k_elections.2.d:0 "The votes are being counted."
 eu4_2k_elections.2.a:0 "Continue"
 eu4_2k_elections.3.t:0 "The Government Is Re-elected"
 eu4_2k_elections.3.d:0 "Voters have returned the governing bloc to office for another term."
 eu4_2k_elections.3.a:0 "The people have spoken"
 eu4_2k_elections.4.t:0 "A Change of Government"
 eu4_2k_elections.4.d:0 "The opposition has won the election. A new government takes office and sets a new political direction."
 eu4_2k_elections.4.a:0 "We accept the verdict of the voters"
 eu4_2k_elections.5.t:0 "A Protest Vote"
 eu4_2k_elections.5.d:0 "Discontent with the established parties has carried an outsider movement into government."
 eu4_2k_elections.5.a:0 "A new political era begins"
 eu4_2k_governing_bloc_left_tt:0 "Governing bloc: Left"
 eu4_2k_bloc_modifier_left:0 "Left Government"
 desc_eu4_2k_bloc_modifier_left:0 "A left-wing government expands the welfare state and is sceptical of military spending."
 eu4_2k_governing_bloc_centre_left_tt:0 "Governing bloc: Centre-Left"
 eu4_2k_bloc_modifier_centre_left:0 "Centre-Left Government"
 desc_eu4_2k_bloc_modifier_centre_left:0 "A social-democratic government favours social cohesion and international cooperation."
 eu4_2k_governing_bloc_liberal_tt:0 "Governing bloc: Liberal"
 eu4_2k_bloc_modifier_liberal:0 "Liberal Government"
 desc_eu4_2k_bloc_modifier_liberal:0 "A liberal government favours open markets, trade, and private enterprise."
 eu4_2k_governing_bloc_centre_right_tt:0 "Governing bloc: Centre-Right"
 eu4_2k_bloc_modifier_centre_right:0 "Centre-Right Government"
 desc_eu4_2k_bloc_modifier_centre_right:0 "A centre-right government favours fiscal discipline and a credible defence."
 eu4_2k_governing_bloc_national_conservative_tt:0 "Governing bloc: National-Conservative"
 eu4_2k_bloc_modifier_national_conservative:0 "National-Conservative Government"
 desc_eu4_2k_bloc_modifier_national_conservative:0 "A national-conservative government puts sovereignty and security first, at some cost to its foreign relations."
 eu4_2k_governing_bloc_coalition_tt:0 "Governing bloc: Governing Coalition"
