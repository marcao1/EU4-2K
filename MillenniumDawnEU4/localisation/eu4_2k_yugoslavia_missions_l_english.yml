l_english:
 eu4_2k_yug_stabilize_federation_title:0 "Stabilize the Federal Republic"
 eu4_2k_yug_stabilize_federation_desc:0 "End the immediate disorder and restore the authority of the federal government."
 eu4_2k_yug_resolve_political_crisis_title:0 "Resolve the Political Crisis"
 eu4_2k_yug_resolve_political_crisis_desc:0 "The struggle over Yugoslavia's political future must reach a durable conclusion."
 eu4_2k_yug_restore_public_finances_title:0 "Restore Public Finances"
 eu4_2k_yug_restore_public_finances_desc:0 "A solvent treasury is essential to rebuilding the state."
 eu4_2k_yug_reform_federal_institutions_title:0 "Reform Federal Institutions"
 eu4_2k_yug_reform_federal_institutions_desc:0 "Modern, accountable institutions can replace the machinery of political crisis."
 eu4_2k_yug_choose_national_future_title:0 "Choose the National Future"
 eu4_2k_yug_choose_national_future_desc:0 "We must decide whether to renew the Yugoslav project or complete the transition to a Serbian republic."
 eu4_2k_yug_preserve_federal_union_title:0 "Preserve the Federal Union"
 eu4_2k_yug_preserve_federal_union_desc:0 "Commit the state to restoring a common South Slavic federation, by agreement where possible and force where necessary."
 eu4_2k_yug_renew_macedonian_relations_title:0 "Renew Macedonian Relations"
 eu4_2k_yug_renew_macedonian_relations_desc:0 "Bring Macedonia into a new framework of cooperation or restore federal authority there."
 eu4_2k_yug_reconcile_bosnia_title:0 "Reconcile Bosnia"
 eu4_2k_yug_reconcile_bosnia_desc:0 "Any renewed Yugoslavia must offer Bosnia and Herzegovina security and equality."
 eu4_2k_yug_negotiate_with_croatia_title:0 "Open Talks with Croatia"
 eu4_2k_yug_negotiate_with_croatia_desc:0 "Repair the relationship with Croatia or establish control over its former federal territory."
 eu4_2k_yug_restore_slovenian_ties_title:0 "Restore Slovenian Ties"
 eu4_2k_yug_restore_slovenian_ties_desc:0 "Slovenia's participation will prove that the federation is more than a southern alliance."
 eu4_2k_yug_rebuild_common_market_title:0 "Rebuild the Common Market"
 eu4_2k_yug_rebuild_common_market_desc:0 "Reconnect the industries, transport corridors, and markets divided by the dissolution."
 eu4_2k_yug_federation_of_equals_title:0 "A Federation of Equals"
 eu4_2k_yug_federation_of_equals_desc:0 "A durable federation must rest on equal republics rather than domination from the center."
 eu4_2k_yug_proclaim_renewed_yugoslavia_title:0 "Proclaim Renewed Yugoslavia"
 eu4_2k_yug_proclaim_renewed_yugoslavia_desc:0 "With Croatia, Bosnia, Macedonia, and Slovenia integrated into a common federal order, the Yugoslav project can be renewed."
 eu4_2k_yug_rebuild_industry_title:0 "Rebuild National Industry"
 eu4_2k_yug_rebuild_industry_desc:0 "Economic reform and industrial investment will reverse the damage of the preceding decade."
 eu4_2k_yug_modernize_belgrade_title:0 "Modernize Belgrade"
 eu4_2k_yug_modernize_belgrade_desc:0 "Make Belgrade a modern administrative, commercial, and cultural capital."
 eu4_2k_yug_restore_transport_networks_title:0 "Restore Transport Networks"
 eu4_2k_yug_restore_transport_networks_desc:0 "Repair the roads, railways, utilities, and communications connecting the country."
 eu4_2k_yug_fight_organized_crime_title:0 "Fight Organized Crime"
 eu4_2k_yug_fight_organized_crime_desc:0 "Reassert the rule of law over networks that prospered during war and sanctions."
 eu4_2k_yug_reform_higher_education_title:0 "Reform Higher Education"
 eu4_2k_yug_reform_higher_education_desc:0 "Universities and research institutions will supply the skills required by a modern economy."
 eu4_2k_yug_attract_foreign_investment_title:0 "Attract Foreign Investment"
 eu4_2k_yug_attract_foreign_investment_desc:0 "Political stability and credible institutions can bring capital back to the country."
 eu4_2k_yug_complete_reconstruction_title:0 "Complete National Reconstruction"
 eu4_2k_yug_complete_reconstruction_desc:0 "Leave the crises of the 1990s behind and establish a foundation for lasting growth."
 eu4_2k_ser_constitutional_convention_title:0 "Call a Constitutional Convention"
 eu4_2k_ser_constitutional_convention_desc:0 "Prepare democratic institutions for a sovereign Serbian republic."
 eu4_2k_ser_define_republic_title:0 "Define the Serbian Republic"
 eu4_2k_ser_define_republic_desc:0 "Clarify the authority, rights, and responsibilities of the new state."
 eu4_2k_ser_settle_montenegro_title:0 "Settle Montenegro's Status"
 eu4_2k_ser_settle_montenegro_desc:0 "Choose between continued union, a confederal settlement, and a peaceful separation."
 eu4_2k_ser_address_kosovo_title:0 "Address the Kosovo Question"
 eu4_2k_ser_address_kosovo_desc:0 "Determine whether Kosovo will be integrated, granted substantial autonomy, or recognized as independent."
