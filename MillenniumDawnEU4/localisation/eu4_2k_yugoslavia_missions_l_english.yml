 eu4_2k_yugoslavia.1.t:0 "The National Question"
 eu4_2k_yugoslavia.1.d:0 "The old federation has collapsed, but Yugoslavia still exists in law and in the ambitions of its leaders. We must decide whether to rebuild a wider Yugoslav federation or peacefully refound the country as Serbia."
 eu4_2k_yugoslavia.1.a:0 "Renew the Yugoslav project."
 eu4_2k_yugoslavia.1.b:0 "Reform the state and form Serbia."
 eu4_2k_yugoslavia.2.t:0 "The Status of Montenegro"
 eu4_2k_yugoslavia.2.d:0 "Montenegro's relationship with Belgrade cannot remain undefined. Continued union, a looser confederation, and recognized independence each offer different risks and opportunities."
 eu4_2k_yugoslavia.2.a:0 "Preserve a common state."
 eu4_2k_yugoslavia.2.b:0 "Adopt a confederal settlement."
 eu4_2k_yugoslavia.2.c:0 "Recognize an independent Montenegro."
 eu4_2k_yugoslavia.3.t:0 "The Kosovo Settlement"
 eu4_2k_yugoslavia.3.d:0 "Kosovo remains the country's most difficult territorial and political question. Direct integration, substantial autonomy, and negotiated independence would each define Serbia's future in a different way."
 eu4_2k_yugoslavia.3.a:0 "Restore direct administration."
 eu4_2k_yugoslavia.3.b:0 "Grant substantial autonomy."
 eu4_2k_yugoslavia.3.c:0 "Recognize an independent Kosovo."
 eu4_2k_peaceful_separation_opinion:0 "Peaceful Separation"

