 eu4_2k_politics.1.t:0 "The Croatian Parliamentary Transition"
 eu4_2k_politics.1.d:0 "The parliamentary election has opened the way for a new coalition government and a peaceful transfer of executive authority."
 eu4_2k_politics.1.a:0 "Entrust Ivica Racan with the government"
 eu4_2k_politics.1.b:0 "Keep the Croatian Democratic Union in office"
 eu4_2k_politics.2.t:0 "The Austrian Coalition Negotiations"
 eu4_2k_politics.2.d:0 "Coalition negotiations will determine whether Austria changes political direction or preserves the outgoing governing arrangement."
 eu4_2k_politics.2.a:0 "Form the Schussel government"
 eu4_2k_politics.2.b:0 "Preserve Klima's coalition"
 eu4_2k_politics.3.t:0 "The Succession to Obuchi"
 eu4_2k_politics.3.d:0 "The governing party must select a successor after Prime Minister Obuchi can no longer carry out his duties."
 eu4_2k_politics.3.a:0 "Select Yoshiro Mori"
 eu4_2k_politics.3.b:0 "Back Koichi Kato"
 eu4_2k_politics.4.t:0 "A New Italian Cabinet"
 eu4_2k_politics.4.d:0 "The collapse of the previous cabinet requires parliament to assemble another governing majority."
 eu4_2k_politics.4.a:0 "Form the Amato cabinet"
 eu4_2k_politics.4.b:0 "Keep D'Alema in office"
 eu4_2k_politics.5.t:0 "The Putin Presidency"
 eu4_2k_politics.5.d:0 "Vladimir Putin has won the presidential election and now seeks a mandate to consolidate the Russian state."
 eu4_2k_politics.5.a:0 "Consolidate the Putin presidency"
 eu4_2k_politics.5.b:0 "Turn toward liberal pluralism"
 eu4_2k_politics.6.t:0 "Taiwan's Democratic Transfer"
 eu4_2k_politics.6.d:0 "The presidential election has produced the first transfer of power between parties in Taiwan's democratic era."
 eu4_2k_politics.6.a:0 "Inaugurate Chen Shui-bian"
 eu4_2k_politics.6.b:0 "Keep the Kuomintang in power"
 eu4_2k_politics.7.t:0 "The Yugoslav Presidential Crisis"
 eu4_2k_politics.7.d:0 "Mass protests and a disputed election have brought the political order created by Slobodan Milosevic to a breaking point."
 eu4_2k_politics.7.a:0 "Recognize Kostunica's victory"
 eu4_2k_politics.7.b:0 "Milosevic holds onto power"
 eu4_2k_politics.8.t:0 "The 2000 Presidential Election"
 eu4_2k_politics.8.d:0 "The closely contested election will decide the direction of the United States at the beginning of the new century."
 eu4_2k_politics.8.a:0 "Inaugurate George W. Bush"
 eu4_2k_politics.8.b:0 "Al Gore prevails"
 eu4_2k_politics.9.t:0 "The Israeli Prime-Ministerial Election"
 eu4_2k_politics.9.d:0 "The electorate must choose its response to the escalating security and political crisis."
 eu4_2k_politics.9.a:0 "Form the Sharon government"
 eu4_2k_politics.9.b:0 "Return Ehud Barak"
 eu4_2k_politics.10.t:0 "The Koizumi Reform Mandate"
 eu4_2k_politics.10.d:0 "The Liberal Democratic Party must decide whether to embrace structural reform or return to its traditional leadership."
 eu4_2k_politics.10.a:0 "Choose Junichiro Koizumi"
 eu4_2k_politics.10.b:0 "Restore Ryutaro Hashimoto"
 eu4_2k_politics.11.t:0 "The Italian General Election"
 eu4_2k_politics.11.d:0 "A new parliamentary majority is ready to form Italy's government."
 eu4_2k_politics.11.a:0 "Form the Berlusconi government"
 eu4_2k_politics.11.b:0 "Form a Rutelli government"
 eu4_2k_politics.12.t:0 "The Polish Parliamentary Transition"
 eu4_2k_politics.12.d:0 "The election has shifted the parliamentary balance and created a new governing majority."
 eu4_2k_politics.12.a:0 "Form the Miller government"
 eu4_2k_politics.12.b:0 "Preserve the Buzek government"
 eu4_2k_politics.13.t:0 "The Portuguese Change of Government"
 eu4_2k_politics.13.d:0 "The parliamentary election has produced a choice between a center-right cabinet and continued Socialist government."
 eu4_2k_politics.13.a:0 "Form the Barroso government"
 eu4_2k_politics.13.b:0 "Keep the Socialists in office"
 eu4_2k_politics.14.t:0 "The Dutch Coalition Settlement"
 eu4_2k_politics.14.d:0 "Fragmented election results require the formation of a new coalition government."
 eu4_2k_politics.14.a:0 "Form the Balkenende cabinet"
 eu4_2k_politics.14.b:0 "Build a Labour-led coalition"
 eu4_2k_politics.15.t:0 "The Fourth Generation of Chinese Leadership"
 eu4_2k_politics.15.d:0 "The Sixteenth Party Congress has prepared a transfer of senior party authority to a new generation."
 eu4_2k_politics.15.a:0 "Transfer authority to Hu Jintao"
 eu4_2k_politics.15.b:0 "Extend Jiang Zemin's leadership"
 eu4_2k_politics.16.t:0 "The Sanader Government"
 eu4_2k_politics.16.d:0 "Croatia's election has produced a new parliamentary majority and another test of democratic succession."
 eu4_2k_politics.16.a:0 "Form the Sanader government"
 eu4_2k_politics.16.b:0 "Return the Racan coalition"
 eu4_2k_politics.17.t:0 "Georgia's Rose Revolution"
 eu4_2k_politics.17.d:0 "The collapse of the previous political order has created a mandate for sweeping institutional reform."
 eu4_2k_politics.17.a:0 "Inaugurate Mikheil Saakashvili"
 eu4_2k_politics.17.b:0 "Entrust the transition to Nino Burjanadze"
 eu4_2k_politics.18.t:0 "The Greek Parliamentary Transition"
 eu4_2k_politics.18.d:0 "The election has ended a long period of PASOK government and produced a new majority."
 eu4_2k_politics.18.a:0 "Form the Karamanlis government"
 eu4_2k_politics.18.b:0 "Renew the PASOK mandate"
 eu4_2k_politics.19.t:0 "The Spanish Change of Government"
 eu4_2k_politics.19.d:0 "The general election has shifted the parliamentary majority amid an intense national security debate."
 eu4_2k_politics.19.a:0 "Form the Zapatero government"
 eu4_2k_politics.19.b:0 "Form a Rajoy government"
 eu4_2k_politics.20.t:0 "The Indian General Election"
 eu4_2k_politics.20.d:0 "A coalition assembled after the general election must choose the next prime minister of India."
 eu4_2k_politics.20.a:0 "Form the Singh government"
 eu4_2k_politics.20.b:0 "Renew Vajpayee's mandate"
 eu4_2k_politics.21.t:0 "The Portuguese Succession"
 eu4_2k_politics.21.d:0 "The departure of the prime minister requires the governing majority to select a successor."
 eu4_2k_politics.21.a:0 "Form the Santana Lopes government"
 eu4_2k_politics.21.b:0 "Call an early Socialist government"
 eu4_2k_politics.22.t:0 "Ukraine's Orange Revolution"
 eu4_2k_politics.22.d:0 "A disputed election and mass demonstrations have forced a decisive test of Ukraine's political direction."
 eu4_2k_politics.22.a:0 "Inaugurate Viktor Yushchenko"
 eu4_2k_politics.22.b:0 "Confirm Viktor Yanukovych"
 eu4_2k_politics.23.t:0 "The Portuguese Socialist Majority"
 eu4_2k_politics.23.d:0 "The election has produced a clear parliamentary majority after a period of unstable government."
 eu4_2k_politics.23.a:0 "Form the Socrates government"
 eu4_2k_politics.23.b:0 "Renew Santana Lopes's mandate"
 eu4_2k_politics.24.t:0 "The German Grand Coalition"
 eu4_2k_politics.24.d:0 "The federal election has produced a narrow result and difficult negotiations over the chancellorship."
 eu4_2k_politics.24.a:0 "Form the Merkel government"
 eu4_2k_politics.24.b:0 "Keep Schroder as chancellor"
 eu4_2k_politics.100.t:0 "The September 11 Attacks"
 eu4_2k_politics.100.d:0 "Coordinated terrorist attacks have struck New York and Washington. The government must respond while the country confronts a profound national shock."
 eu4_2k_politics.100.a:0 "A global campaign against terrorism"
 eu4_2k_politics.100.b:0 "A restrained security response"
 eu4_2k_politics.101.t:0 "The American Ultimatum"
 eu4_2k_politics.101.d:0 "Washington demands that Afghanistan surrender al-Qaeda's leadership and close its training network. Compliance could avert war but fracture the ruling coalition."
 eu4_2k_politics.101.a:0 "Reject the ultimatum"
 eu4_2k_politics.101.b:0 "Cooperate with the United States"
 eu4_2k_politics.102.t:0 "The Afghanistan Decision"
 eu4_2k_politics.102.d:0 "The Afghan authorities have rejected American demands. The administration must choose between military intervention and a longer campaign of diplomatic pressure."
 eu4_2k_politics.102.a:0 "Authorize military intervention"
 eu4_2k_politics.102.b:0 "Maintain sanctions and diplomatic pressure"
 eu4_2k_politics.103.t:0 "Resolution 1441 and the Inspectors"
 eu4_2k_politics.103.d:0 "A new international inspection regime demands immediate and unrestricted Iraqi cooperation. Baghdad must decide how to answer."
 eu4_2k_politics.103.a:0 "Accept unrestricted inspections"
 eu4_2k_politics.103.b:0 "Obstruct and delay the inspectors"
 eu4_2k_politics.104.t:0 "The Iraq Crisis"
 eu4_2k_politics.104.d:0 "The inspection crisis has reached its decisive point. The United States must choose between regime change and continued containment."
 eu4_2k_politics.104.a:0 "Pursue regime change"
 eu4_2k_politics.104.b:0 "Continue containment"
 eu4_2k_politics.105.t:0 "The International Response to September 11"
 eu4_2k_politics.105.d:0 "The attacks in the United States have triggered demands for international security cooperation. Our government must define its response."
 eu4_2k_politics.105.a:0 "Support counterterrorism cooperation"
 eu4_2k_politics.105.b:0 "Keep an independent distance"
 eu4_2k_counterterrorism_cooperation:0 "Counterterrorism Cooperation"
 eu4_2k_security_disagreement:0 "Security Policy Disagreement"
 eu4_2k_security_confrontation:0 "Security Confrontation"
