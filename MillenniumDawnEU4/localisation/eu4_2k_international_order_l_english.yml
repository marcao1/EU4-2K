l_english:
 eu4_2k_modern_international_order:0 "Modern International Order"
 desc_eu4_2k_modern_international_order:0 "The United Nations Charter outlaws wars of conquest. Fabricating claims, seizing territory, and absorbing conquered land carry far heavier diplomatic and administrative costs than in earlier centuries."
 eu4_2k_condemned_for_aggression:0 "Condemned for Aggression"
 desc_eu4_2k_condemned_for_aggression:0 "We launched a war of conquest in violation of the UN Charter. Governments shun us, trading partners impose informal sanctions, and every further conquest alarms our neighbours."
 eu4_2k_rallying_against_aggression:0 "Rallying Against Aggression"
 desc_eu4_2k_rallying_against_aggression:0 "An unprovoked war of conquest against us has united the nation and drawn international sympathy."
 eu4_2k_violated_un_charter:0 "Violated the UN Charter"
 eu4_2k_order.1.t:0 "International Condemnation"
 eu4_2k_order.1.d:0 "Our declaration of a war of conquest has been condemned around the world as a violation of the United Nations Charter. Ambassadors are being recalled, investors are pulling back, and our neighbours now watch every move we make."
 eu4_2k_order.1.a:0 "We will answer for this in our own time"
 eu4_2k_order.2.t:0 "An Unprovoked Attack"
 eu4_2k_order.2.d:0 "We have been attacked in a war of conquest. The international community has condemned the aggression, and the nation is rallying to defend its territory."
 eu4_2k_order.2.a:0 "We will defend every province"
 EU4_2K_AI_NO_CLAIM_FABRICATION:0 "Under the modern international order, only revisionist powers fabricate claims."
